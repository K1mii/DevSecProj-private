apiVersion: apps/v1
kind: Deployment
metadata:
  name: kami-devsec-proj
  namespace: kami-devsecops
  labels:
    app: kami-devsec-proj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kami-devsec-proj
  template:
    metadata:
      labels:
        app: kami-devsec-proj
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: kami-devsec-proj
      containers:
        - name: kami-devsec-proj
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/kami-devsec-proj:latest
          ports:
            - containerPort: 8080

            
---


apiVersion: v1
kind: Service
metadata:
  name: kami-devsec-proj-svc
  namespace: kami-devsecops
  labels:
    app: kami-devsec-proj
spec:
  type: NodePort
  selector:
    app: kami-devsec-proj
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      nodePort: 31000